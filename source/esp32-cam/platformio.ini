[platformio]
default_envs = ai-thinker-esp32-cam

[env:ai-thinker-esp32-cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_unflags =
    -std=gnu++11
board_build.psram = enabled
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I../embedded/include
