[platformio]
default_envs = yd_esp32_s3_safe

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bblanchon/ArduinoJson@7.4.2
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D CORE_DEBUG_LEVEL=1
  -D HSHH_MAX_MOTOR_PERCENT=60
  -D HSHH_MOTOR_BRAKE_MS=80

[env:yd_esp32_s3_safe]
build_flags =
  ${env.build_flags}
  -D HSHH_ENABLE_SERVO=0
  -D HSHH_ALLOW_UNSENSORED_MOTION=1
  -D HSHH_ENABLE_SERIAL_BENCH=0

[env:yd_esp32_s3_bench]
build_flags =
  ${env.build_flags}
  -D HSHH_ENABLE_SERVO=1
  -D HSHH_ALLOW_UNSENSORED_MOTION=0
  -D HSHH_ENABLE_SERIAL_BENCH=1

